<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>STUDIO 70 BRAND | Checkout & Frete</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e7e3;--card:#ffffff;--muted:#66645f;--text:#11110f;--accent:#2a2926;--green:#1b1b19;--line:#c9c6c0;--white:#fff;--font-display:'Anton',Impact,sans-serif;--font-body:'Space Grotesk',Arial,sans-serif}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body)}
.container{max-width:800px;margin:30px auto;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:12px}
h2{font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px;margin-top:0}
.field-group{margin-bottom:15px} label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:5px}
.field{width:100%;background:#fff;color:var(--text);border:1px solid var(--line);padding:12px;border-radius:8px;outline:none}
.field:focus{border-color:var(--accent)}
.btn{border:2px solid #0d0d0f;border-radius:2px;padding:12px 20px;font-family:var(--font-display);font-weight:400;letter-spacing:1px;text-transform:uppercase;font-size:15px;background:var(--accent);color:#fff;cursor:pointer;width:100%;margin-top:10px}
.btn:hover{filter:brightness(1.1)}
.shipping-options{display:grid;gap:8px;margin-top:10px}
.shipping-option{display:flex;justify-content:space-between;padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.shipping-option input{margin-right:10px}
.qrcode-box{text-align:center;margin-top:20px;padding:15px;background:#f5f4f1;border-radius:8px}
.qrcode-box img{max-width:200px;height:auto}
</style>
</head>
<body>

<div class="container">
  <h2>Checkout Inteligente</h2>
  
  <!-- Seção de Frete (SuperFrete) -->
  <div class="field-group">
    <h3>1. Calcular Frete (SuperFrete)</h3>
    <label>CEP de Destino</label>
    <div style="display:flex;gap:10px;">
      <input class="field" id="cepDestino" placeholder="00000-000" maxlength="9">
      <button class="btn" style="margin-top:0;width:180px;" type="button" onclick="calcularFrete()">Calcular</label>
    </div>
    <div id="resultadoFrete" class="shipping-options"></div>
  </div>

  <hr style="border:0;border-top:1px solid var(--line);margin:20px 0;">

  <!-- Seção de Pagamento (Mercado Pago - Cartão & Pix) -->
  <div class="field-group">
    <h3>2. Forma de Pagamento (Mercado Pago)</h3>
    <label>Método de Pagamento</label>
    <select class="field" id="tipoPagamento" onchange="alternarMetodoPagamento()">
      <option value="pix">PIX (Mercado Pago)</option>
      <option value="credit_card">Cartão de Crédito (Mercado Pago)</option>
    </select>
  </div>

  <!-- Campos específicos para Cartão -->
  <div id="cardFields" style="display:none;">
    <div class="field-group">
      <label>Número do Cartão</label>
      <input class="field" id="cardNumber" placeholder="0000 0000 0000 0000">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="field-group">
        <label>Validade (MM/AA)</label>
        <input class="field" id="cardExpiration" placeholder="MM/AA">
      </div>
      <div class="field-group">
        <label>CVV</label>
        <input class="field" id="cardCvv" placeholder="123">
      </div>
    </div>
    <div class="field-group">
      <label>Nome impresso no Cartão</label>
      <input class="field" id="cardHolderName" placeholder="Nome Completo">
    </div>
    <div class="field-group">
      <label>Parcelas</label>
      <select class="field" id="installments">
        <option value="1">1x sem juros</option>
        <option value="2">2x sem juros</option>
        <option value="3">3x sem juros</option>
      </select>
    </div>
  </div>

  <!-- Dados do Comprador -->
  <div class="field-group">
    <label>E-mail do Comprador</label>
    <input class="field" id="emailComprador" type="email" placeholder="email@exemplo.com">
  </div>
  <div class="field-group">
    <label>CPF do Comprador</label>
    <input class="field" id="cpfComprador" placeholder="000.000.000-00">
  </div>

  <button class="btn" type="button" onclick="processarCheckout()">FINALIZAR PAGAMENTO</button>

  <!-- Área de Exibição do Pix QR Code -->
  <div id="pixContainer" class="qrcode-box" style="display:none;">
    <h4>Escaneie o QR Code Pix para pagar</h4>
    <div id="pixQrCodeImage"></div>
    <p style="font-size:12px;word-break:break-all;margin-top:10px;" id="pixCopyPaste"></p>
  </div>
</div>

<script>
// Configuração do SuperFrete e Mercado Pago (Substitua pelas suas credenciais e endpoints reais de backend)
const SUPERFRETE_TOKEN = "SEU_TOKEN_SUPERFRETE";
const BACKEND_MP_URL = "https://seu-backend-ou-edge-function.com/criar-pagamento"; 

function alternarMetodoPagamento() {
  const metodo = document.getElementById('tipoPagamento').value;
  const cardFields = document.getElementById('cardFields');
  cardFields.style.display = metodo === 'credit_card' ? 'block' : 'none';
}

async function calcularFrete() {
  const cep = document.getElementById('cepDestino').value.replace(/\D/g, '');
  const resultadoDiv = document.getElementById('resultadoFrete');
  
  if (cep.length !== 8) {
    alert('Digite um CEP válido com 8 dígitos.');
    return;
  }

  resultadoDiv.innerHTML = 'Calculando frete...';

  try {
    // Exemplo de requisição para a API do SuperFrete (Nota: Requisições reais para SuperFrete devem passar por um backend seguro para expor o token)
    const response = await fetch('https://sandbox.superfrete.com/api/v0/calculator', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'User-Agent': 'Studio70 (contato@studio70.com)'
      },
      body: JSON.stringify({
        "from": {"postal_code": "01001000"}, // CEP de origem da loja
        "to": {"postal_code": cep},
        "products": [{"id": "1", "width": 11, "height": 11, "length": 16, "weight": 0.3, "insurance_value": 30.0, "quantity": 1}]
      })
    });

    const data = await response.json();
    resultadoDiv.innerHTML = '';

    if(Array.isArray(data)) {
      data.forEach(item => {
        if(!item.error) {
          resultadoDiv.innerHTML += `
            <label class="shipping-option">
              <div>
                <input type="radio" name="frete" value="${item.price}">
                <strong>${item.name}</strong> (${item.delivery_time} dias úteis)
              </div>
              <span>R$ ${item.price}</span>
            </label>
          `;
        }
      });
    } else {
      resultadoDiv.innerHTML = 'Erro ao calcular o frete. Verifique o CEP.';
    }
  } catch (error) {
    console.error(error);
    resultadoDiv.innerHTML = 'Erro de conexão com a API SuperFrete.';
  }
}

async function processarCheckout() {
  const tipoPagamento = document.getElementById('tipoPagamento').value;
  const email = document.getElementById('emailComprador').value;
  const cpf = document.getElementById('cpfComprador').value;

  if(!email || !cpf) {
    alert('Preencha o e-mail e o CPF do comprador.');
    return;
  }

  const payload = {
    transaction_amount: 50.00, // Exemplo de valor total do pedido
    description: "Compra na STUDIO 70 BRAND",
    payment_method_id: tipoPagamento === 'pix' ? 'pix' : 'visa', // Ajuste conforme bandeira/método
    payer: {
      email: email,
      identification: { type: 'CPF', number: cpf.replace(/\D/g, '') }
    }
  };

  try {
    // Chamada ao seu backend que interage de forma segura com a API do Mercado Pago
    alert('Enviando dados para processamento seguro no Mercado Pago...');
    
    /* 
      Exemplo de integração com o backend:
      const res = await fetch(BACKEND_MP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const respostaMP = await res.json();
    */

    // Simulação visual de resposta Pix caso escolhido Pix
    if(tipoPagamento === 'pix') {
      document.getElementById('pixContainer').style.display = 'block';
      document.getElementById('pixQrCodeImage').innerHTML = '<p><b>[QR Code Gerado via API Mercado Pago]</b></p>';
      document.getElementById('pixCopyPaste').innerText = '00020126580014br.gov.bcb.pix... [Chave Copia e Cola]';
    } else {
      alert('Pagamento com cartão processado com sucesso!');
    }

  } catch (err) {
    console.error(err);
    alert('Erro ao processar o pagamento.');
  }
}
</script>
</body>
</html>
