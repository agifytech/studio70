<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja ST70 - Checkout Mercado Pago</title>
  <style>
    :root {
      --primary: #111;
      --accent: #25d366;
      --bg: #f4f4f4;
      --card-bg: #fff;
    }
    body { font-family: Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 8px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .product-card { border: 1px solid #ddd; padding: 15px; border-radius: 6px; text-align: center; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn:hover { opacity: 0.9; }
    .field { width: 100%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    
    /* Modais */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
    .modal.open { display: flex; }
    .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    
    /* Pagamento */
    .pay-methods { display: flex; gap: 10px; margin-bottom: 15px; }
    .pay-method { flex: 1; padding: 10px; border: 1px solid #ccc; background: #fff; cursor: pointer; text-align: center; border-radius: 4px; }
    .pay-method.active { border-color: var(--primary); background: #eee; font-weight: bold; }
    .status { margin-top: 10px; padding: 10px; border-radius: 4px; text-align: center; font-size: 14px; }
    .status.ok { background: #e6f4ea; color: #137333; }
    .status.error { background: #fce8e6; color: #c5221f; }
  </style>
</head>
<body>

<div class="container">
  <h2>Catálogo de Produtos</h2>
  <div id="productsGrid" class="products-grid"></div>

  <h2>Seu Carrinho</h2>
  <div id="cartList"></div>
  <p><strong>Total: R$ <span id="cartTotal">0.00</span></strong></p>
  <button class="btn" onclick="goCheckout()">Avançar para o Checkout</button>
</div>

<!-- Modal Checkout Integrado -->
<div class="modal" id="integratedCheckoutModal">
  <div class="modal-content">
    <span style="float:right; cursor:pointer; font-weight:bold;" onclick="closeIntegratedCheckout()">&times;</span>
    <h3>Checkout Integrado</h3>
    
    <h4>1. Dados Pessoais</h4>
    <input type="text" id="name" class="field" placeholder="Nome Completo">
    <input type="email" id="email" class="field" placeholder="E-mail">
    <input type="text" id="cpf" class="field" placeholder="CPF (somente números)">
    <input type="tel" id="phone" class="field" placeholder="Telefone / WhatsApp">

    <h4>2. Forma de Pagamento</h4>
    <div class="pay-methods">
      <div class="pay-method active" data-method="pix" onclick="selectIntegratedPayment('pix')">PIX</div>
      <div class="pay-method" data-method="card" onclick="selectIntegratedPayment('card')">Cartão</div>
    </div>

    <!-- Pagamento via PIX -->
    <div id="pixBox">
      <p>Pague via QR Code ou Copia e Cola do Mercado Pago.</p>
      <button class="btn" onclick="createPixPayment()">Gerar PIX</button>
      <div style="text-align: center; margin-top: 15px;">
        <img id="pixQr" src="" alt="QR Code PIX" style="display:none; width: 200px; margin: 0 auto;">
        <input type="text" id="pixCode" class="field" readonly style="display:none;" onclick="this.select()">
      </div>
    </div>

    <!-- Pagamento via Cartão -->
    <div id="cardBox" style="display:none;">
      <input type="text" id="cardNumber" class="field" placeholder="Número do Cartão">
      <input type="text" id="cardHolder" class="field" placeholder="Nome Impresso no Cartão">
      <div style="display:flex; gap:10px;">
        <input type="text" id="cardExp" class="field" placeholder="MM/AA">
        <input type="text" id="cardCvc" class="field" placeholder="CVC">
      </div>
      <select id="installmentsSelect" class="field">
        <option value="1">1x sem juros</option>
        <option value="2">2x sem juros</option>
        <option value="3">3x sem juros</option>
      </select>
      <button class="btn" onclick="startCardCheckout()">Pagar com Cartão</button>
    </div>

    <div id="paymentStatus" class="status" style="display:none;"></div>

    <hr style="margin: 20px 0;">
    <h4>Resumo do Pedido</h4>
    <div id="items"></div>
    <p>Subtotal: <strong id="subtotal">R$ 0.00</strong></p>
    <p>Total: <strong id="total">R$ 0.00</strong></p>
  </div>
</div>

<script>
// Array do Catálogo de Produtos
const SEED_PRODUCTS = [
  { id: "p1", name: "Camiseta Basic ST70", price: 79.90 },
  { id: "p2", name: "Boné Aba Reta ST70", price: 59.90 },
  { id: "p3", name: "Moletom Oversized", price: 189.90 },
  { id: "p4", name: "Calça Jogger Streetwear", price: 129.90 },
  { id: "p5", name: "Bermuda Cargo", price: 99.90 }
];

// Configuração do Endpoint de Pagamento (Mercado Pago / Edge Function)
if (!localStorage.getItem('mpEndpoint')) {
  localStorage.setItem('mpEndpoint', 'https://sua-edge-function.com/api/mercado-pago');
}

// Inicialização do Carrinho via localStorage
let cart = JSON.parse(localStorage.getItem('st70_cart')) || [];
let selectedPaymentMethod = 'pix';

// Renderizar Produtos da Loja
function renderProducts() {
  const grid = document.getElementById('productsGrid');
  if (!grid) return;
  grid.innerHTML = SEED_PRODUCTS.map(product => `
    <div class="product-card">
      <h4>${product.name}</h4>
      <p>R$ ${product.price.toFixed(2)}</p>
      <button class="btn" onclick="addToCart('${product.id}')">Adicionar ao Carrinho</button>
    </div>
  `).join('');
}

// Adicionar produto ao carrinho
function addToCart(productId) {
  const product = SEED_PRODUCTS.find(p => p.id === productId);
  if (!product) return;

  const existingItem = cart.find(item => item.id === productId);
  if (existingItem) {
    existingItem.qty += 1;
  } else {
    cart.push({ ...product, qty: 1 });
  }

  saveCart();
  renderCart();
}

function saveCart() {
  localStorage.setItem('st70_cart', JSON.stringify(cart));
}

// Renderizar itens do carrinho
function renderCart() {
  const cartList = document.getElementById('cartList');
  if (!cartList) return;

  if (cart.length === 0) {
    cartList.innerHTML = '<p>Seu carrinho está vazio.</p>';
    document.getElementById('cartTotal').innerText = '0.00';
    return;
  }

  let total = 0;
  cartList.innerHTML = cart.map((item, index) => {
    total += item.price * item.qty;
    return `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span>${item.qty}x ${item.name}</span>
        <div>
          <strong>R$ ${(item.price * item.qty).toFixed(2)}</strong>
          <button style="margin-left:8px; cursor:pointer;" onclick="removeFromCart(${index})">&times;</button>
        </div>
      </div>
    `;
  }).join('');
  
  document.getElementById('cartTotal').innerText = total.toFixed(2);
}

function removeFromCart(index) {
  cart.splice(index, 1);
  saveCart();
  renderCart();
}

// Modal e Checkout Integrado
function goCheckout() {
  if (cart.length === 0) {
    alert("Seu carrinho está vazio!");
    return;
  }
  document.getElementById('integratedCheckoutModal').classList.add('open');
  renderIntegratedSummary();
}

function closeIntegratedCheckout() {
  document.getElementById('integratedCheckoutModal').classList.remove('open');
}

function selectIntegratedPayment(method) {
  selectedPaymentMethod = method;
  document.querySelectorAll('.pay-method').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.method === method);
  });
  document.getElementById('cardBox').style.display = (method === 'card') ? 'block' : 'none';
  document.getElementById('pixBox').style.display = (method === 'pix') ? 'block' : 'none';
}

function renderIntegratedSummary() {
  const itemsContainer = document.getElementById('items');
  let subtotal = 0;
  itemsContainer.innerHTML = cart.map(item => {
    const itemTotal = item.price * item.qty;
    subtotal += itemTotal;
    return `
      <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
        <span>${item.qty}x ${item.name}</span>
        <strong>R$ ${itemTotal.toFixed(2)}</strong>
      </div>`;
  }).join('');
  document.getElementById('subtotal').innerText = `R$ ${subtotal.toFixed(2)}`;
  document.getElementById('total').innerText = `R$ ${subtotal.toFixed(2)}`;
}

// Processar Pagamento via PIX (Mercado Pago)
async function createPixPayment() {
  const statusEl = document.getElementById('paymentStatus');
  const endpoint = localStorage.getItem('mpEndpoint');
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const cpf = document.getElementById('cpf').value;

  if (!name || !email || !cpf) {
    statusEl.style.display = 'block';
    statusEl.className = 'status error';
    statusEl.innerText = 'Preencha Nome, E-mail e CPF para continuar.';
    return;
  }

  statusEl.style.display = 'block';
  statusEl.className = 'status';
  statusEl.innerText = 'Gerando PIX com o Mercado Pago...';

  try {
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        payment_method: 'pix',
        payer: { name, email, cpf },
        items: cart
      })
    });

    const data = await response.json();

    if (response.ok && data.qr_code) {
      const qrImg = document.getElementById('pixQr');
      const qrCodeInput = document.getElementById('pixCode');
      
      qrImg.src = `data:image/png;base64,${data.qr_code_base64}`;
      qrImg.style.display = 'block';
      
      qrCodeInput.value = data.qr_code;
      qrCodeInput.style.display = 'block';
      
      statusEl.className = 'status ok';
      statusEl.innerText = 'PIX gerado com sucesso! Utilize o QR Code ou Copia e Cola acima.';
    } else {
      throw new Error(data.message || 'Erro ao gerar o PIX.');
    }
  } catch (err) {
    statusEl.className = 'status error';
    statusEl.innerText = err.message;
  }
}

// Processar Pagamento via Cartão de Crédito
async function startCardCheckout() {
  const statusEl = document.getElementById('paymentStatus');
  const endpoint = localStorage.getItem('mpEndpoint');
  
  statusEl.style.display = 'block';
  statusEl.className = 'status';
  statusEl.innerText = 'Processando cartão...';

  try {
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        payment_method: 'card',
        payer: {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          cpf: document.getElementById('cpf').value
        },
        card: {
          number: document.getElementById('cardNumber').value,
          holder: document.getElementById('cardHolder').value,
          exp: document.getElementById('cardExp').value,
          cvc: document.getElementById('cardCvc').value,
          installments: document.getElementById('installmentsSelect').value
        },
        items: cart
      })
    });

    const data = await response.json();

    if (response.ok && data.status === 'approved') {
      statusEl.className = 'status ok';
      statusEl.innerText = 'Pagamento aprovado com sucesso!';
      localStorage.removeItem('st70_cart');
      cart = [];
      renderCart();
    } else {
      throw new Error(data.message || 'Pagamento recusado.');
    }
  } catch (err) {
    statusEl.className = 'status error';
    statusEl.innerText = err.message;
  }
}

// Inicialização da Página
renderProducts();
renderCart();
</script>
</body>
</html>
